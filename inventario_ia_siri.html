<script type="module">
async function obtenerMovimientosKardex() {
let select = document.getElementById("producto");
let productoId = select.value;
let productoNombre = select.options[select.selectedIndex]?.text || "";

if (!productoId) {
return {
productoId,
productoNombre,
movimientos: [],
error: "Primero selecciona un producto."
};
}

const snapshot = await getDocs(collection(db, "movimientos"));
let movimientos = [];

snapshot.forEach(docSnap => {
let movimiento = docSnap.data();

if (movimiento.productoId === productoId || movimiento.producto === productoNombre) {
movimientos.push(movimiento);
}
});

movimientos.sort((a, b) => obtenerFecha(a.fecha) - obtenerFecha(b.fecha));

return {
productoId,
productoNombre,
movimientos,
error: ""
};
}

async function verKardex() {
let tablaKardex = document.getElementById("tablaKardex");
let kardexPanel = document.getElementById("kardexPanel");
let mensajeKardex = document.getElementById("mensajeKardex");

kardexPanel.style.display = "block";
mensajeKardex.innerHTML = "Buscando movimientos del producto seleccionado...";
kardexPanel.scrollIntoView({ behavior: "smooth", block: "start" });
tablaKardex.innerHTML = `
<tr>
<td colspan="7">Cargando movimientos...</td>
</tr>
`;

try {
let resultado = await obtenerMovimientosKardex();

if (resultado.error) {
mensajeKardex.innerHTML = resultado.error;
tablaKardex.innerHTML = `
<tr>
<td colspan="7">${resultado.error}</td>
</tr>
`;
return;
}

if (resultado.movimientos.length === 0) {
mensajeKardex.innerHTML = "Sin movimientos para este producto.";
tablaKardex.innerHTML = `
<tr>
<td colspan="7">No hay movimientos para ${resultado.productoNombre}.</td>
</tr>
`;
return;
}

let stock = 0;
let html = "";

for (let m of resultado.movimientos) {
let cantidad = Number(m.cantidad) || 0;

if (m.tipo === "entrada") stock += cantidad;
else if (m.tipo === "salida") stock -= cantidad;

html += `
<tr>
<td>${formatearFecha(m.fecha)}</td>
<td>${m.producto || resultado.productoNombre}</td>
<td>${m.tipo || ""}</td>
<td>${m.tipo === "entrada" ? cantidad : ""}</td>
<td>${m.tipo === "salida" ? cantidad : ""}</td>
<td>${stock}</td>
<td>${m.usuario || ""}</td>
</tr>
`;
}

tablaKardex.innerHTML = html;
mensajeKardex.innerHTML = "Kardex cargado correctamente.";

} catch (error) {
console.error("Error al cargar Kardex:", error);
mensajeKardex.innerHTML = "Error al cargar Kardex.";
tablaKardex.innerHTML = `
<tr>
<td colspan="7">No se pudo cargar el Kardex: ${error.message}</td>
</tr>
`;
}
}

async function exportarKardexExcel() {
let mensajeKardex = document.getElementById("mensajeKardex");

try {
mensajeKardex.innerHTML = "Preparando Excel del Kardex...";
let resultado = await obtenerMovimientosKardex();

if (resultado.error) {
alert(resultado.error);
mensajeKardex.innerHTML = resultado.error;
return;
}

if (resultado.movimientos.length === 0) {
alert("No hay movimientos para exportar de " + resultado.productoNombre + ".");
mensajeKardex.innerHTML = "Sin movimientos para exportar.";
return;
}

let stock = 0;
let data = resultado.movimientos.map(m => {
let cantidad = Number(m.cantidad) || 0;

if (m.tipo === "entrada") stock += cantidad;
else if (m.tipo === "salida") stock -= cantidad;

return {
Fecha: formatearFecha(m.fecha),
Producto: m.producto || resultado.productoNombre,
Tipo: m.tipo || "",
Entrada: m.tipo === "entrada" ? cantidad : "",
Salida: m.tipo === "salida" ? cantidad : "",
Stock: stock,
Usuario: m.usuario || ""
};
});

const ws = XLSX.utils.json_to_sheet(data);
const wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb, ws, "Kardex");
XLSX.writeFile(wb, "Kardex_" + limpiarNombreArchivo(resultado.productoNombre) + ".xlsx");

mensajeKardex.innerHTML = "Excel del Kardex generado correctamente.";

} catch (error) {
console.error("Error al exportar Kardex:", error);
alert("No se pudo exportar el Kardex: " + error.message);
mensajeKardex.innerHTML = "Error al exportar Kardex.";
}
}

function obtenerFecha(fecha) {
if (!fecha) return 0;
if (typeof fecha.toMillis === "function") return fecha.toMillis();
if (fecha.seconds) return fecha.seconds * 1000;
return new Date(fecha).getTime() || 0;
}

function formatearFecha(fecha) {
let milisegundos = obtenerFecha(fecha);
if (!milisegundos) return "Sin fecha";
return new Date(milisegundos).toLocaleString();
}

function limpiarNombreArchivo(nombre) {
return (nombre || "Producto").replace(/[\\/:*?"<>|]/g, "_").replace(/\s+/g, "_");
}

function renderizarInventario(busqueda){
let tabla = document.getElementById("tabla");
let select = document.getElementById("producto");
let filtro = normalizarTexto(busqueda || "");

let productosFiltrados = inventarioProductos.filter(item => coincideProducto(item, filtro));

tabla.innerHTML = "";
select.innerHTML = "";

if (productosFiltrados.length === 0) {
tabla.innerHTML = `
<tr>
<td colspan="4">No se encontraron productos parecidos.</td>
</tr>
`;
select.innerHTML = `<option value="">Sin resultados</option>`;
return;
}

productosFiltrados.forEach(item => {
tabla.innerHTML += `
<tr>
<td>${item.categoria}</td>
<td>${item.codigo}</td>
<td>${item.producto}</td>
<td>${item.stock}</td>
</tr>
`;

select.innerHTML += `<option value="${item.id}">${item.producto}</option>`;
});
}

function coincideProducto(item, filtro){

if (!filtro) return true;

let nombre = normalizarTexto(item.producto);
let codigo = normalizarTexto(item.codigo);
let categoria = normalizarTexto(item.categoria);

let textoCompleto = `${nombre} ${codigo} ${categoria}`;

if (textoCompleto.includes(filtro)) return true;

let palabrasBusqueda = filtro.split(" ").filter(Boolean);
let palabrasProducto = textoCompleto.split(" ").filter(Boolean);

let coincidencias = 0;

for(let busqueda of palabrasBusqueda){

let encontrado = false;

for(let palabra of palabrasProducto){

if(palabra.includes(busqueda)){
encontrado = true;
break;
}

let distancia = distanciaLevenshtein(palabra, busqueda);

let porcentaje =
1 - (distancia / Math.max(palabra.length, busqueda.length));

if(porcentaje >= 0.7){
encontrado = true;
break;
}

}

if(encontrado){
coincidencias++;
}

}

return coincidencias >= Math.max(1, palabrasBusqueda.length - 1);

}

function normalizarTexto(texto){
return String(texto || "")
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g, "")
.replace(/[^a-z0-9\s]/g, " ")
.replace(/\s+/g, " ")
.trim();
}

function esParecido(texto, busqueda){

if (!texto || !busqueda) return false;

texto = normalizarTexto(texto);
busqueda = normalizarTexto(busqueda);

if (texto.includes(busqueda)) return true;

let distancia = distanciaLevenshtein(texto, busqueda);

let similitud =
1 - (distancia / Math.max(texto.length, busqueda.length));

return similitud >= 0.7;

}

function distanciaLevenshtein(a, b){
let matriz = [];

for (let i = 0; i <= b.length; i++) matriz[i] = [i];
for (let j = 0; j <= a.length; j++) matriz[0][j] = j;

for (let i = 1; i <= b.length; i++) {
for (let j = 1; j <= a.length; j++) {
if (b.charAt(i - 1) === a.charAt(j - 1)) {
matriz[i][j] = matriz[i - 1][j - 1];
} else {
matriz[i][j] = Math.min(
matriz[i - 1][j - 1] + 1,
matriz[i][j - 1] + 1,
matriz[i - 1][j] + 1
);
}
}
}

return matriz[b.length][a.length];
}

let escuchandoContinuamente = false;
let reconocimientoContinuo = null;

function iniciarModoSiri(){

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
alert("Tu navegador no soporta reconocimiento de voz.");
return;
}

if(reconocimientoContinuo){
reconocimientoContinuo.stop();
}

reconocimientoContinuo = new SpeechRecognition();

reconocimientoContinuo.lang = "es-ES";
reconocimientoContinuo.continuous = true;
reconocimientoContinuo.interimResults = false;

escuchandoContinuamente = true;

agregarMensajeChat("Modo voz activado. Di: Hola Veracruz", "ia");

reconocimientoContinuo.onresult = async function(event){

let texto = event.results[event.results.length - 1][0].transcript;

agregarMensajeChat("Escuchado: " + texto, "usuario");

let limpio = normalizarTexto(texto);

if(limpio.includes("hola veracruz")){

hablar("Te escucho");

return;

}

document.getElementById("ordenIA").value = texto;

await enviarOrdenIA();

};

reconocimientoContinuo.onerror = function(event){
console.error(event);
};

reconocimientoContinuo.start();

}

function detenerModoSiri(){

if(reconocimientoContinuo){
reconocimientoContinuo.stop();
}

escuchandoContinuamente = false;

agregarMensajeChat("Modo voz desactivado", "ia");

}

function escucharOrdenIA(){
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
alert("Tu navegador no soporta reconocimiento de voz. Prueba con Google Chrome o Edge.");
return;
}

let reconocimiento = new SpeechRecognition();
reconocimiento.lang = "es-ES";
reconocimiento.interimResults = false;
reconocimiento.maxAlternatives = 1;

agregarMensajeChat("Escuchando...", "ia");

reconocimiento.onresult = function(event){
let texto = event.results[0][0].transcript;
document.getElementById("ordenIA").value = texto;
agregarMensajeChat("Texto reconocido: " + texto, "ia");
enviarOrdenIA();
};

reconocimiento.onerror = function(event){
agregarMensajeChat("No pude reconocer el audio: " + event.error, "ia");
};
}
async function consultarChatGPTInventario(orden){
let respuesta = await fetch(CHATGPT_INVENTARIO_URL, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
orden: orden,
productos: inventarioProductos.map(item => ({
id: item.id,
producto: item.producto,
codigo: item.codigo,
categoria: item.categoria,
stock: item.stock
}))
})
});

if (!respuesta.ok) {
throw new Error("El backend respondió con error " + respuesta.status);
}

return await respuesta.json();
}

function interpretarOrdenBasica(orden){
let texto = normalizarTexto(orden);
let tipo = "";

if (texto.includes("entrada") || texto.includes("agrega") || texto.includes("sumar") || texto.includes("suma") || texto.includes("ingresa")) {
tipo = "entrada";
}

if (texto.includes("salida") || texto.includes("saca") || texto.includes("resta") || texto.includes("descuenta") || texto.includes("vende")) {
tipo = "salida";
}

let cantidadEncontrada = texto.match(/\d+/);
let cantidad = cantidadEncontrada ? parseInt(cantidadEncontrada[0]) : 0;
let producto = buscarProductoEnOrden(texto);

if (!tipo || !cantidad || !producto) {
return {
respuesta: "No entendí completamente. Prueba con algo como: agrega 5 unidades de aceite motor.",
accion: null
};
}

return {
respuesta: "Entendí una " + tipo + " de " + cantidad + " unidad(es) para " + producto.producto + ".",
accion: {
tipo: tipo,
cantidad: cantidad,
productoId: producto.id,
producto: producto.producto
}
};
}

function buscarProductoEnOrden(texto){
let mejorProducto = null;
let mejorPuntaje = -1;

inventarioProductos.forEach(item => {
let nombre = normalizarTexto(item.producto);
let codigo = normalizarTexto(item.codigo);
let categoria = normalizarTexto(item.categoria);
let puntaje = 0;

if (texto.includes(nombre)) puntaje += 100;
if (codigo && texto.includes(codigo)) puntaje += 80;

nombre.split(" ").forEach(palabra => {
if (palabra.length > 2 && texto.includes(palabra)) puntaje += 10;
});

categoria.split(" ").forEach(palabra => {
if (palabra.length > 2 && texto.includes(palabra)) puntaje += 3;
});

if (puntaje > mejorPuntaje) {
mejorPuntaje = puntaje;
mejorProducto = item;
}
});

return mejorPuntaje > 0 ? mejorProducto : null;
}

async function confirmarAccionIA(){
if (!accionIAPendiente || accionIAProcesando) return;

accionIAProcesando = true;
document.getElementById("btnConfirmarIA").disabled = true;

let accion = accionIAPendiente;
accionIAPendiente = null;

document.getElementById("producto").value = accion.productoId;
document.getElementById("cantidad").value = accion.cantidad;

try {
if (accion.tipo === "entrada") await window.entrada();
if (accion.tipo === "salida") await window.salida();

agregarMensajeChat("Acción aplicada correctamente.", "ia"); hablar("Acción aplicada correctamente");
document.getElementById("confirmacionIA").style.display = "none";
} catch (error) {
console.error("Error al aplicar acción IA:", error);
agregarMensajeChat("No pude aplicar la acción: " + error.message, "ia");
accionIAPendiente = accion;
document.getElementById("btnConfirmarIA").disabled = false;
} finally {
accionIAProcesando = false;
}
}

function cancelarAccionIA(){
accionIAPendiente = null;
accionIAProcesando = false;

let movimientoEnProceso = false;
/* ================= ENTRADA ================= */
window.entrada = async function(){

if (movimientoEnProceso) return;
movimientoEnProceso = true;

let id = document.getElementById("producto").value;
let c = parseInt(document.getElementById("cantidad").value);

if(!c || c <= 0) {
movimientoEnProceso = false;
return;
}

const snap = await getDocs(collection(db,"inventario"));

for(let d of snap.docs){

if(d.id == id){

let data = d.data();

await updateDoc(doc(db,"inventario",id),{
stock: data.stock + c
});

await addDoc(collection(db,"movimientos"),{
producto: data.producto,
productoId: id,
tipo: "entrada",
cantidad: c,
usuario: window.usuarioActual,
fecha: Timestamp.now()
});

mostrar();
movimientoEnProceso = false;
return;

}

}

movimientoEnProceso = false;
}

/* ================= SALIDA ================= */
window.salida = async function(){

if (movimientoEnProceso) return;
movimientoEnProceso = true;

let id = document.getElementById("producto").value;
let c = parseInt(document.getElementById("cantidad").value);

if(!c || c <= 0) {
movimientoEnProceso = false;
return;
}

const snap = await getDocs(collection(db,"inventario"));

for(let d of snap.docs){

if(d.id == id){

let data = d.data();

if(data.stock < c){
alert("Stock insuficiente");
movimientoEnProceso = false;
return;
}

await updateDoc(doc(db,"inventario",id),{
stock: data.stock - c
});

await addDoc(collection(db,"movimientos"),{
producto: data.producto,
productoId: id,
tipo: "salida",
cantidad: c,
usuario: window.usuarioActual,
fecha: Timestamp.now()
});

mostrar();
movimientoEnProceso = false;
return;

}

}

movimientoEnProceso = false;
}

/* ================= EXCEL ================= */
window.exportarExcel = async function(){

const snap = await getDocs(collection(db,"inventario"));

let data = [];

snap.forEach(d => {
let i = d.data();
data.push({
Categoria: i.categoria,
Codigo: i.codigo,
Producto: i.producto,
Stock: i.stock
});
});

const ws = XLSX.utils.json_to_sheet(data);
const wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb, ws, "Inventario");

XLSX.writeFile(wb, "Inventario_Veracruz.xlsx");

}

/* ================= SALIR ================= */
window.salir = function(){
location.reload();
}
